services:
  - type: web
    name: market-sim-api
    runtime: docker
    plan: starter
    dockerfilePath: ./api/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: SEC_USER_AGENT
        sync: false
      - key: ARENA_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false

  - type: web
    name: market-sim-frontend
    runtime: docker
    plan: starter
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: .
    envVars:
      - key: VITE_API_URL
        sync: false
