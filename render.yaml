previews:
  generation: off

services:
  - type: web
    name: market-sim-api
    runtime: docker
    plan: free
    region: oregon
    autoDeployTrigger: checksPass
    dockerfilePath: ./api/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: market-sim-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_PROJECT_ID
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: SEC_USER_AGENT
        sync: false
      - key: ARENA_API_KEY
        generateValue: true
      - key: STARTING_CASH
        value: "100000"
      - key: ANALYST_AGENT_TOOLS_ENABLED
        value: "true"
      - key: RAG_BOOTSTRAP_ON_STARTUP
        value: "true"
      - key: RAG_BOOTSTRAP_TICKERS
        value: "AAPL,MSFT,NVDA,GOOGL,TSLA"
      - key: RAG_BOOTSTRAP_FORMS
        value: "10-K,10-Q,8-K"
      - key: RAG_BOOTSTRAP_MAX_FILINGS
        value: "1"
      - key: RAG_BOOTSTRAP_MAX_RETRIES
        value: "1"
      - key: RAG_BOOTSTRAP_EMBED_LIMIT
        value: "1500"
      - key: RAG_BOOTSTRAP_EMBED_BATCH_SIZE
        value: "64"
      - key: RAG_BOOTSTRAP_BOT_DELAY_SECS
        value: "120"
      - key: FRONTEND_URL
        fromService:
          name: market-sim-frontend
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: market-sim-frontend
    runtime: static
    autoDeployTrigger: checksPass
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: market-sim-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: market-sim-db
    plan: free
    region: oregon
    databaseName: marketsim
    user: marketsim
    postgresMajorVersion: "17"
    ipAllowList: []
