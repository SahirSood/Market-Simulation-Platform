previews:
  generation: off

services:
  - type: web
    name: market-sim-api
    runtime: docker
    plan: free
    region: oregon
    autoDeployTrigger: checksPass
    dockerfilePath: ./api/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: market-sim-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_PROJECT_ID
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: SEC_USER_AGENT
        sync: false
      - key: ARENA_API_KEY
        generateValue: true
      - key: STARTING_CASH
        value: "100000"
      - key: PUBLIC_READ_ONLY_MODE
        value: "true"
      - key: PUBLIC_OPS_DETAIL_ENABLED
        value: "false"
      - key: SANDBOX_ENABLED
        value: "false"
      - key: BOT_CYCLE_MINS
        value: "90"
      - key: MARKET_HOURS_ONLY
        value: "true"
      - key: MARKET_TIMEZONE
        value: "America/New_York"
      - key: MARKET_OPEN_TIME
        value: "09:30"
      - key: MARKET_CLOSE_TIME
        value: "16:00"
      - key: LLM_COST_GUARD_ENABLED
        value: "true"
      - key: LLM_DAILY_DECISION_BUDGET
        value: "45"
      - key: LLM_MONTHLY_DECISION_BUDGET
        value: "900"
      - key: LLM_DAILY_SPEND_LIMIT_USD
        value: "1"
      - key: LLM_MONTHLY_SPEND_LIMIT_USD
        value: "20"
      - key: LLM_FALLBACK_ESTIMATED_COST_PER_CALL_USD
        value: "0.02"
      - key: LLM_CLAUDE_DAILY_CALL_BUDGET
        value: "22"
      - key: LLM_CLAUDE_MONTHLY_CALL_BUDGET
        value: "450"
      - key: LLM_OPENAI_DAILY_CALL_BUDGET
        value: "25"
      - key: LLM_OPENAI_MONTHLY_CALL_BUDGET
        value: "450"
      - key: NEWS_CACHE_TTL
        value: "1800"
      - key: LLM_MAX_TOKENS
        value: "128"
      - key: LLM_PROMPT_CACHE_ENABLED
        value: "true"
      - key: LLM_SKIP_UNCHANGED_PROMPTS
        value: "true"
      - key: RAG_TOP_K
        value: "2"
      - key: PROMPT_TRENDING_LIMIT
        value: "4"
      - key: PROMPT_RECENT_LIMIT
        value: "4"
      - key: PROMPT_TICKER_LIMIT
        value: "1"
      - key: PROMPT_TICKER_HEADLINE_LIMIT
        value: "1"
      - key: PROMPT_EVIDENCE_LIMIT
        value: "2"
      - key: PROMPT_EVIDENCE_CHARS
        value: "90"
      - key: EVIDENCE_QUERY_HEADLINE_LIMIT
        value: "1"
      - key: TRADABLE_TICKERS
        value: "AAPL,MSFT,NVDA,GOOGL,TSLA,SPY,QQQ,TLT,GLD,IEF"
      - key: SEED_LIQUIDITY_ON_STARTUP
        value: "true"
      - key: SEED_LIQUIDITY_LEVELS
        value: "3"
      - key: SEED_LIQUIDITY_QTY
        value: "500"
      - key: SEED_LIQUIDITY_SPREAD_PCT
        value: "0.002"
      - key: ANALYST_AGENT_TOOLS_ENABLED
        value: "false"
      - key: RAG_REQUIRE_EVIDENCE_FOR_TRADES
        value: "true"
      - key: RAG_EVIDENCE_REQUIRED_BOTS
        value: "AnalystBot,MacroBot"
      - key: RAG_SPECULATIVE_BOTS
        value: "DegenBot"
      - key: RESEARCH_AUTO_INGEST_ENABLED
        value: "true"
      - key: RESEARCH_TRIGGER_ACTIONS
        value: "BUY,SELL"
      - key: RESEARCH_MAX_TICKERS_PER_DAY
        value: "2"
      - key: RESEARCH_TICKER_COOLDOWN_MINS
        value: "360"
      - key: RESEARCH_MAX_FILINGS_PER_TICKER
        value: "1"
      - key: RESEARCH_FORMS
        value: "10-K,10-Q,8-K"
      - key: RESEARCH_EMBED_LIMIT
        value: "300"
      - key: RESEARCH_EXPAND_TRADABLE_UNIVERSE
        value: "true"
      - key: RAG_BOOTSTRAP_ON_STARTUP
        value: "true"
      - key: RAG_BOOTSTRAP_TICKERS
        value: "AAPL,MSFT,NVDA,GOOGL,TSLA"
      - key: RAG_BOOTSTRAP_FORMS
        value: "10-K,10-Q,8-K"
      - key: RAG_BOOTSTRAP_MAX_FILINGS
        value: "1"
      - key: RAG_BOOTSTRAP_MAX_RETRIES
        value: "1"
      - key: RAG_BOOTSTRAP_EMBED_LIMIT
        value: "1000"
      - key: RAG_BOOTSTRAP_EMBED_BATCH_SIZE
        value: "64"
      - key: RAG_BOOTSTRAP_BOT_DELAY_SECS
        value: "120"
      - key: FRONTEND_URL
        fromService:
          name: market-sim-frontend
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: market-sim-frontend
    runtime: static
    autoDeployTrigger: checksPass
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: market-sim-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: market-sim-db
    plan: free
    region: oregon
    databaseName: marketsim
    user: marketsim
    postgresMajorVersion: "17"
    ipAllowList: []
