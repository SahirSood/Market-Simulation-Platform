services:
  - type: web
    name: market-sim-api
    runtime: docker
    plan: free
    dockerfilePath: ./api/Dockerfile
    healthCheckPath: /health
    preDeployCommand: alembic upgrade head
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: SEC_USER_AGENT
        sync: false
      - key: ARENA_API_KEY
        sync: false
      - key: FRONTEND_URL
        fromService:
          name: market-sim-frontend
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: market-sim-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: market-sim-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
