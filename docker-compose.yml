services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////app/data/marketsim.db
      ARENA_OFFLINE_MODE: "true"
      ARENA_API_KEY: local-docker-key
      STARTING_CASH: "100000"
      PUBLIC_READ_ONLY_MODE: "true"
      PUBLIC_OPS_DETAIL_ENABLED: "false"
      SANDBOX_ENABLED: "false"
      API_SECURITY_HEADERS_ENABLED: "true"
      API_HSTS_ENABLED: "false"
      API_CORS_ALLOW_LOCALHOST: "true"
      API_RATE_LIMIT_ENABLED: "true"
      API_RATE_LIMIT_REQUESTS_PER_MINUTE: "240"
      API_WRITE_RATE_LIMIT_REQUESTS_PER_MINUTE: "60"
      API_MAX_REQUEST_BODY_BYTES: "1048576"
    volumes:
      - ./data:/app/data
    depends_on: []

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
