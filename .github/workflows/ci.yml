name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///ci.db
      ANTHROPIC_API_KEY: test-anthropic-key
      OPENAI_API_KEY: test-openai-key
      NEWS_API_KEY: test-news-key
      SEC_USER_AGENT: MarketSimulationPlatformCI/1.0 ci@example.com
      ARENA_API_KEY: ci-demo-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run Python tests
        shell: bash
        run: |
          mkdir -p artifacts
          set -o pipefail
          pytest -q | tee artifacts/pytest.log

      - name: Build native engine
        run: |
          cmake -S engine -B engine/build -DCMAKE_BUILD_TYPE=Release
          cmake --build engine/build --config Release
          ctest --test-dir engine/build --output-on-failure -C Release

      - name: Smoke API container
        run: docker build -f api/Dockerfile -t market-sim-api:ci .

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Smoke frontend container
        run: docker build -f frontend/Dockerfile --build-arg VITE_API_URL=http://localhost:8000 -t market-sim-frontend:ci .

      - name: Upload test logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-logs
          path: artifacts
          if-no-files-found: ignore

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: ignore
