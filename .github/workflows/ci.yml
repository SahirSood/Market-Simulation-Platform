name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///ci.db
      ANTHROPIC_API_KEY: test-anthropic-key
      OPENAI_API_KEY: test-openai-key
      NEWS_API_KEY: test-news-key
      SEC_USER_AGENT: MarketSimulationPlatformCI/1.0 ci@example.com
      ARENA_API_KEY: ci-demo-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run Python tests
        run: pytest -q

      - name: Build native engine
        run: |
          cmake -S engine -B engine/build -DCMAKE_BUILD_TYPE=Release
          cmake --build engine/build --config Release
          ctest --test-dir engine/build --output-on-failure -C Release

      - name: Smoke API container
        run: docker build -f api/Dockerfile -t market-sim-api:ci .

      - name: Build frontend
        working-directory: frontend
        run: npm install && npm run build
