name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///ci.db
      ANTHROPIC_API_KEY: test-anthropic-key
      OPENAI_API_KEY: test-openai-key
      NEWS_API_KEY: test-news-key
      SEC_USER_AGENT: MarketSimulationPlatformCI/1.0 ci@example.com
      ARENA_API_KEY: ci-demo-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Scan tracked files for secrets
        run: python scripts/scan_tracked_secrets.py

      - name: Run Python tests
        shell: bash
        run: |
          mkdir -p artifacts
          set -o pipefail
          pytest -q | tee artifacts/pytest.log

      - name: Run database migrations
        run: DATABASE_URL=sqlite:///ci_migration.db alembic upgrade head

      - name: Build native engine
        run: |
          cmake -S engine -B engine/build -DCMAKE_BUILD_TYPE=Release
          cmake --build engine/build --config Release
          ctest --test-dir engine/build --output-on-failure -C Release
          python scripts/container_smoke.py --require-native

      - name: Validate production deployment environment contract
        env:
          DATABASE_URL: postgresql://test_user:test_password@db.company.test:5432/marketsim
          ANTHROPIC_API_KEY: anthropic_live_key
          OPENAI_API_KEY: openai_live_key
          OPENAI_PROJECT_ID: proj_live_project
          NEWS_API_KEY: news_live_key
          SEC_USER_AGENT: MarketSimulationPlatform/1.0 ci@example.com
          ARENA_API_KEY: strong-write-key
          FRONTEND_URL: https://dashboard.company.test
          VITE_API_URL: https://api.company.test
          VITE_PLAUSIBLE_DOMAIN: dashboard.company.test
          VITE_PLAUSIBLE_SRC: https://plausible.io/js/script.outbound-links.js
          VITE_SITE_ANALYTICS_ENABLED: "true"
          PUBLIC_READ_ONLY_MODE: "true"
          SANDBOX_ENABLED: "false"
          ENGINE_NATIVE_REQUIRED: "true"
          API_SECURITY_HEADERS_ENABLED: "true"
          API_HSTS_ENABLED: "true"
          API_CORS_ALLOW_LOCALHOST: "false"
          API_RATE_LIMIT_ENABLED: "true"
          API_RATE_LIMIT_REQUESTS_PER_MINUTE: "240"
          API_WRITE_RATE_LIMIT_REQUESTS_PER_MINUTE: "30"
          API_MAX_REQUEST_BODY_BYTES: "1048576"
          LLM_DAILY_SPEND_LIMIT_USD: "1"
          LLM_MONTHLY_SPEND_LIMIT_USD: "20"
        run: python scripts/check_deploy_env.py --production

      - name: Render Compose config without env-file secrets
        run: docker compose config > /tmp/compose.yml

      - name: Smoke API container
        run: docker build -f api/Dockerfile -t market-sim-api:ci .

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Smoke frontend container
        run: docker build -f frontend/Dockerfile --build-arg VITE_API_URL=http://localhost:8000 -t market-sim-frontend:ci .

      - name: Upload test logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-logs
          path: artifacts
          if-no-files-found: ignore

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: ignore
